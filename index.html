
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>البازل التعليمي الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Tajawal', sans-serif;
        background-color: #fdfcf0;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      .playful-bg {
        background-color: #fdfcf0;
        background-image: radial-gradient(#ffeaa7 1.5px, transparent 1.5px), radial-gradient(#ffeaa7 1.5px, #fdfcf0 1.5px);
        background-size: 60px 60px;
        background-position: 0 0, 30px 30px;
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      .animate-shake {
        animation: shake 0.2s ease-in-out 0s 2;
      }
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      .floating {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes success-pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); filter: brightness(1.2); }
        100% { transform: scale(1); }
      }
      .animate-success {
        animation: success-pop 0.5s ease-out;
      }
      @keyframes glow-pulse {
        0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
        70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
        100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
      }
      .animate-glow {
        animation: glow-pulse 1.5s infinite;
      }

      /* حركات الشخصية الكرتونية الجديدة */
      @keyframes mascot-happy {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-30px) scale(1.1); }
      }
      .mascot-happy {
        animation: mascot-happy 0.5s ease-in-out infinite;
      }

      @keyframes mascot-think {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-15deg); }
        75% { transform: rotate(15deg); }
      }
      .mascot-think {
        animation: mascot-think 1s ease-in-out infinite;
      }

      @keyframes mascot-wave {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(20deg); }
      }
      .mascot-wave {
        animation: mascot-wave 1s ease-in-out infinite;
        transform-origin: bottom center;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
